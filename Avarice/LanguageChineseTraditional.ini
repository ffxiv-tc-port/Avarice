Enable Splatoon IPC==啟用 Splatoon IPC
Enables changing the colour of your Player Damage Pixel based on if your position is determined to be within the bounds of a preset configured as "dangerous".==啟用後，若你的位置被判定在設為「危險」的 Splatoon 預設範圍內，玩家傷害判定點的顏色會跟著改變
Danger Pixel Colour==危險判定點顏色
The colour your Player Damage Pixel will change to if you are standing in a configured danger zone. You must have the Player Damage Pixel feature enabled for this to do anything.==站在設定好的危險區域時，玩家傷害判定點會變成的顏色，需要先啟用玩家傷害判定點功能才會生效
This feature will probably not function for any pre-6.5 presets as it specifically requires the preset author to apply the "Dangerous" attribute to the preset metadata for Avarice to read it. Additionally, you must enable this feature in Splatoon in General settings.==此功能對 6.5 版本之前的預設可能無效，因為需要預設作者在中繼資料加上「危險」屬性 Avarice 才能讀取，另外也需要在 Splatoon 的一般設定中啟用此功能
