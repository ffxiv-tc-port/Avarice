Drawing Controls:==繪製控制：
Enable Drawing==啟用繪製
Toggle all overlay drawing features. Can also be toggled with /avarice draw command==切換所有疊層繪製功能，也可用 /avarice draw 指令切換
Only show for positional targets==僅在目標需要方位判定時顯示
When enabled, overlays will only be shown when targeting an enemy that requires positional attacks==啟用後，只有在鎖定需要方位攻擊的敵人時才會顯示疊層
Enable positional feedback VFX on failed positionals==方位判定失敗時顯示特效回饋
Displays either a checkmark or cross above the player's head when they hit or miss a positional. This feature requires VFXEditor to be installed in order to function.==在玩家頭上顯示打中或落空方位的勾號或叉號，此功能需要安裝 VFXEditor 才能運作
Also enable VFX on successful positionals==方位判定成功時也顯示特效
Output positional feedback to chat on failed positional==方位判定失敗時在聊天室輸出回饋
Prints either a success or failure message in the chat when you hit or miss a positional.==在聊天室印出打中或落空方位的訊息
Also print feedback to chat on successful positionals==方位判定成功時也在聊天室輸出回饋
Output encounter performance summary==輸出戰鬥表現總結
Prints an overall summary of your encounter and the positionals hit/missed when leaving combat.==離開戰鬥時印出本次戰鬥的方位命中/落空總結
